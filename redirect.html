<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Beanconqueror…</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #3b1f0e;
      color: #f5efe6;
      text-align: center;
      gap: 16px;
    }
    p { margin: 0; font-size: 18px; }
    small { opacity: 0.7; font-size: 13px; }
  </style>
</head>
<body>
  <p>Opening Beanconqueror…</p>
  <small>You can close this tab once BC opens.</small>
  <script>
    // The beanconqueror:// deep link is passed as the URL hash.
    // This page must load successfully (HTTP 200) before redirecting —
    // that prevents Chrome from firing a "navigation failed" back-press
    // to BC that would immediately dismiss the import modal.
    (function () {
      try {
        var target = decodeURIComponent(location.hash.slice(1));
        if (target.indexOf('beanconqueror://') === 0) {
          location.replace(target);
          // Try to close this tab after the intent fires (best-effort, ignored by some browsers)
          setTimeout(function () { try { window.close(); } catch (e) {} }, 500);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
